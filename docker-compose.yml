# fund-research-agent 本地编排。默认只起 infra（mysql / redis / elasticsearch / milvus）；
# 应用服务（backend、ai-service、mcp-tools、frontend）属于 profile "app"（S7）：docker compose --profile app up -d --build。
# Kafka（kafka + 一次性的 kafka-init 建 topic）在 S11 加入，属于 infra。
# 在 WSL2 里的 Docker Engine 上运行，启动命令见 docs/SETUP.md。
# 端口、密码全部来自 .env（由 scripts/gen_env.py 生成）；mem_limit 按 PLAN §3。

name: ${COMPOSE_PROJECT_NAME:-fra}

services:
  mysql:
    image: mysql:8.4.11
    container_name: fra-mysql
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run scripts/gen_env.py first}
      MYSQL_APP_DB: ${MYSQL_APP_DB:-fra_app}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-fra_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?}
      FUND_DATA_DB: ${FUND_DATA_DB:-fund_data}
      FUND_READER_USER: ${FUND_READER_USER:-fund_reader}
      FUND_READER_PASSWORD: ${FUND_READER_PASSWORD:?}
      FUND_LOADER_USER: ${FUND_LOADER_USER:-fund_loader}
      FUND_LOADER_PASSWORD: ${FUND_LOADER_PASSWORD:?run scripts/gen_env.py --add-missing}
      TZ: Asia/Shanghai
    # 配置用命令行参数而不是挂 conf.d：/mnt/d 下的文件权限是 777，MySQL 会忽略 world-writable 的配置文件（ADR-016）
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=128M
      - --max-connections=100
      - --performance-schema=OFF
      - --skip-name-resolve
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 初始化阶段临时服务器是 skip-networking，TCP ping 不通，因此不会过早报 healthy
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:8.10.2
    container_name: fra-redis
    restart: unless-stopped
    mem_limit: 256m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run scripts/gen_env.py first}
    # 密码经环境变量传入而不是写进 compose 命令行；必须经 docker-entrypoint.sh 且首参为 redis-server，
    # 官方入口脚本才会 --loadmodule 自带的 redisearch/rejson/redistimeseries/redisbloom（ADR-007，S0 实测）。
    # maxmemory 留出进程自身开销，低于 mem_limit
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  elasticsearch:
    build:
      context: ./deploy/elasticsearch
      args:
        ES_VERSION: "8.19.22"
    image: fra/elasticsearch-ik:8.19.22
    container_name: fra-elasticsearch
    restart: unless-stopped
    # 1792m + 堆 1g + direct 上限 256m：S0 实测 1536m 下空载即占 95%（ADR-024）
    mem_limit: 1792m
    environment:
      discovery.type: single-node
      # 本地开发关闭安全认证（ADR-006）：WSL2 NAT 下只经本机 localhost 转发可达、无敏感数据；生产环境必须开启
      xpack.security.enabled: "false"
      # 不用机器学习功能，关掉可省去 ML 本地进程的内存
      xpack.ml.enabled: "false"
      # 笔记本磁盘余量小时避免索引被置为只读
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g -XX:MaxDirectMemorySize=256m"
      TZ: Asia/Shanghai
    ports:
      - "${ES_PORT:-9201}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  milvus:
    image: milvusdb/milvus:v2.5.27
    container_name: fra-milvus
    restart: unless-stopped
    mem_limit: 2g
    # 单容器 standalone：内嵌 etcd + 本地存储，参数取自官方 scripts/standalone_embed.sh（ADR-004）
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      TZ: Asia/Shanghai
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
      - ./deploy/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./deploy/milvus/user.yaml:/milvus/configs/user.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9091/healthz >/dev/null"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s

  # S11：KRaft combined 单节点（broker + controller 同进程），堆 512m / mem_limit 1g（PLAN §3）。
  # 两个 listener：容器网络用 kafka:9092；宿主机（本机跑的 worker、e2e 脚本）用 127.0.0.1:${KAFKA_PORT}。
  # 自动建 topic 关闭，topic 由 kafka-init 显式创建（分区数是设计的一部分，见 ADR-049）。
  kafka:
    image: apache/kafka:3.9.1
    container_name: fra-kafka
    restart: unless-stopped
    mem_limit: 1g
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 40s

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: fra-kafka-init
    restart: "no"
    mem_limit: 256m
    environment:
      KAFKA_HEAP_OPTS: "-Xms64m -Xmx192m"
    # 请求 topic 4 个分区：两个消费者实例能各分到分区；key=doc_id，同一文档的消息总在同一分区里（有序）
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:9092
        $$T --bootstrap-server $$B --create --if-not-exists --topic doc.ingest.requested --partitions 4 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic doc.ingest.result --partitions 2 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic doc.ingest.dlq --partitions 1 --replication-factor 1 --config retention.ms=2592000000
        $$T --bootstrap-server $$B --list
    depends_on:
      kafka:
        condition: service_healthy

  # ------------------------------------------------------------------ 应用服务（profile "app"，S7）
  # 容器内互连一律用服务名和容器端口，宿主机端口（.env 的 *_PORT）只用于对外发布；
  # 每个服务只拿自己用得到的变量（least privilege：例如 ai-service 拿不到 MySQL root 密码）。
  # 构建上下文都是仓库根，Dockerfile 在 deploy/<服务>/。

  mcp-tools:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/mcp-tools/Dockerfile
    image: fra/mcp-tools:dev
    container_name: fra-mcp-tools
    restart: unless-stopped
    mem_limit: 256m
    environment:
      MCP_TOOLS_HOST: 0.0.0.0
      MCP_TOOLS_PORT: "8101"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      FUND_DATA_DB: ${FUND_DATA_DB:-fund_data}
      FUND_READER_USER: ${FUND_READER_USER:-fund_reader}
      FUND_READER_PASSWORD: ${FUND_READER_PASSWORD:-}
      NAV_API_BASE_URL: ${NAV_API_BASE_URL:-https://api.fund.eastmoney.com}
      NAV_TIMEOUT_S: ${NAV_TIMEOUT_S:-3}
      NAV_RETRIES: ${NAV_RETRIES:-2}
      NAV_CACHE_TTL_S: ${NAV_CACHE_TTL_S:-600}
      SQL_MAX_ROWS: ${SQL_MAX_ROWS:-200}
      SQL_TIMEOUT_S: ${SQL_TIMEOUT_S:-5}
      DATA_AS_OF: ${DATA_AS_OF:-}
      TZ: Asia/Shanghai
    ports:
      - "${MCP_TOOLS_PORT:-8101}:8101"
    depends_on:
      mysql:
        condition: service_healthy

  ai-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/ai-service/Dockerfile
    image: fra/ai-service:dev
    container_name: fra-ai-service
    restart: unless-stopped
    mem_limit: 2560m
    environment:
      AI_SERVICE_PORT: "8001"
      AI_GRPC_ENABLED: "true"
      AI_GRPC_HOST: 0.0.0.0
      AI_GRPC_PORT: "50051"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ES_URL: http://elasticsearch:9200
      MILVUS_URI: http://milvus:19530
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      FUND_DATA_DB: ${FUND_DATA_DB:-fund_data}
      FUND_READER_USER: ${FUND_READER_USER:-fund_reader}
      FUND_READER_PASSWORD: ${FUND_READER_PASSWORD:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_THINKING: ${LLM_THINKING:-disabled}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      # Agent 用 HTTP 回环调自己的 /mcp：Host 头是服务名，必须在白名单里（否则 421）
      MCP_TOOLS_URL: http://mcp-tools:8101/mcp
      MCP_DOCS_URL: http://ai-service:8001/mcp
      MCP_ALLOWED_HOSTS: '["127.0.0.1:*","localhost:*","[::1]:*","ai-service:*"]'
      BACKEND_BASE_URL: http://backend:8081
      INTERNAL_CALLBACK_SECRET: ${INTERNAL_CALLBACK_SECRET:-}
      KB_SCOPE_SECRET: ${KB_SCOPE_SECRET:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-bge}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-cross_encoder}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      DATA_AS_OF: ${DATA_AS_OF:-}
      # S10 语义缓存（默认关闭；开启时 Redis 用同一个实例，向量索引名带维度）
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-false}
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.80}
      SEMANTIC_CACHE_GUARD: ${SEMANTIC_CACHE_GUARD:-true}
      SEMANTIC_CACHE_TTL_SECONDS: ${SEMANTIC_CACHE_TTL_SECONDS:-86400}
      SEMANTIC_CACHE_MAX_ANSWER_CHARS: ${SEMANTIC_CACHE_MAX_ANSWER_CHARS:-20000}
      KB_PUBLIC_VERSION: ${KB_PUBLIC_VERSION:-}
      # S11 批量入库的 Kafka 消费者（与 HTTP / gRPC 同进程）；锁与入库状态用同一个 Redis
      KAFKA_CONSUMER_ENABLED: ${KAFKA_CONSUMER_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-fra-ingest}
      KAFKA_TOPIC_REQUESTED: ${KAFKA_TOPIC_REQUESTED:-doc.ingest.requested}
      KAFKA_TOPIC_RESULT: ${KAFKA_TOPIC_RESULT:-doc.ingest.result}
      KAFKA_TOPIC_DLQ: ${KAFKA_TOPIC_DLQ:-doc.ingest.dlq}
      INGEST_LOCK_TTL_MS: ${INGEST_LOCK_TTL_MS:-30000}
      INGEST_LOCK_WAIT_SECONDS: ${INGEST_LOCK_WAIT_SECONDS:-180}
      INGEST_MAX_ATTEMPTS: ${INGEST_MAX_ATTEMPTS:-3}
      TZ: Asia/Shanghai
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
      # gRPC 无鉴权：只绑定宿主机回环（调试 / 压测用），backend 走容器网络 ai-service:50051
      - "127.0.0.1:${AI_GRPC_PORT:-50051}:50051"
    volumes:
      # 模型缓存：命名卷，首次用 `docker compose --profile app run --rm ai-service python -m fund_ai.models_cli` 下载
      - model_cache:/models
      # data/ 只读挂入（MANIFEST、披露 PDF、快照不进镜像）；入库 CLI 按 MANIFEST 里的 data/raw/... 路径读 PDF
      - ./data:/app/data:ro
      # 用户上传：backend 写、ai-service 读，路径在两个容器里必须一致（ai-service 只接受 DATA_DIR 之下的路径）
      - uploads:/app/data/uploads:ro
      # 入库 CLI 把 summary.json 写到 reports/ingest/
      - ./reports:/app/reports
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
      mcp-tools:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    image: fra/backend:dev
    container_name: fra-backend
    restart: unless-stopped
    mem_limit: 768m
    environment:
      BACKEND_PORT: "8081"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_APP_DB: ${MYSQL_APP_DB:-fra_app}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-fra_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_TTL: ${JWT_TTL:-12h}
      INTERNAL_CALLBACK_SECRET: ${INTERNAL_CALLBACK_SECRET:-}
      AI_SERVICE_BASE_URL: http://ai-service:8001
      AI_TRANSPORT: ${AI_TRANSPORT:-grpc}
      AI_SERVICE_GRPC_TARGET: ai-service:50051
      AI_GRPC_CHAT_DEADLINE: ${AI_GRPC_CHAT_DEADLINE:-6m}
      AI_CHAT_IDLE_TIMEOUT: ${AI_CHAT_IDLE_TIMEOUT:-120s}
      CHAT_HISTORY_ROUNDS: ${CHAT_HISTORY_ROUNDS:-6}
      CHAT_HEARTBEAT: ${CHAT_HEARTBEAT:-1s}
      UPLOAD_STALE_AFTER: ${UPLOAD_STALE_AFTER:-15m}
      UPLOAD_DIR: /app/data/uploads
      # S10 限流与每日配额
      RATELIMIT_ENABLED: ${RATELIMIT_ENABLED:-true}
      RATELIMIT_USER_CAPACITY: ${RATELIMIT_USER_CAPACITY:-10}
      RATELIMIT_USER_REFILL_PER_SEC: ${RATELIMIT_USER_REFILL_PER_SEC:-0.5}
      RATELIMIT_GLOBAL_CAPACITY: ${RATELIMIT_GLOBAL_CAPACITY:-100}
      RATELIMIT_GLOBAL_REFILL_PER_SEC: ${RATELIMIT_GLOBAL_REFILL_PER_SEC:-10}
      QUOTA_DAILY_CALLS: ${QUOTA_DAILY_CALLS:-200}
      QUOTA_DAILY_TOKENS: ${QUOTA_DAILY_TOKENS:-500000}
      QUOTA_ZONE: ${QUOTA_ZONE:-Asia/Shanghai}
      QUOTA_FLUSH_INTERVAL: ${QUOTA_FLUSH_INTERVAL:-30s}
      # S11 季报批量入库：outbox relay → Kafka，消费结果 topic；清单只读挂入
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INGEST_BATCH_ENABLED: ${INGEST_BATCH_ENABLED:-true}
      INGEST_MANIFEST_PATH: /app/data/MANIFEST.json
      KAFKA_TOPIC_REQUESTED: ${KAFKA_TOPIC_REQUESTED:-doc.ingest.requested}
      KAFKA_TOPIC_RESULT: ${KAFKA_TOPIC_RESULT:-doc.ingest.result}
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    volumes:
      - uploads:/app/data/uploads
      - ./data/MANIFEST.json:/app/data/MANIFEST.json:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  frontend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    image: fra/frontend:dev
    container_name: fra-frontend
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "${FRONTEND_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  es_data:
  milvus_data:
  kafka_data:
  model_cache:
  uploads:
