[project]
name = "fund-pipeline"
version = "0.0.1"
description = "fund-research-agent 离线数据流水线：基金池、披露 PDF、结构化数据、入库、质量校验（S1 实现；S0 仅骨架）"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # AkShare 固定版本（PLAN §2.1 实测基于此版本；接口变动风险见 PLAN §6）
    "akshare==1.18.97",
    "pandas>=2.2",
    "pyyaml>=6",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pypdf>=5",
    "pymysql>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "reportlab>=4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fund_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: 需要 docker compose 起的 infra",
    "slow: 需要下载或加载本地模型",
    "live: 调用真实 LLM 或访问外网",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.pycodestyle]
# 中文按双宽计：formatter 仍按 100 排版，E501 只对中文注释/字符串放宽到 120
max-line-length = 120
