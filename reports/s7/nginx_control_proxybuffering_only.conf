# 对照组（仅用于 S7 验收 4）：与 deploy/frontend/nginx.conf 相同，只是对话流 location 故意打开代理缓冲、
# 忽略上游的 X-Accel-Buffering: no，并把缓冲区放大到 128k（默认 4k/8k 缓冲时 nginx 仍会把小事件逐个透传，
# 见 PROGRESS S7 验收 4 的说明）。由脚本从生产配置生成，不用于部署。
# 前端 nginx：静态文件 + /api 反向代理到 backend。
# 上游地址用变量 + Docker 内置 DNS（127.0.0.11）：backend 容器重建换了 IP 也不会连到旧地址，
# backend 还没起来时 nginx 自己也能启动（否则 proxy_pass 的主机名在启动时解析失败会直接退出）。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传上限 20MB（backend 的 fra.upload.max-size），multipart 有少量额外开销
    client_max_body_size 22m;

    # 对话流（SSE）：必须关闭缓冲，否则 token 会被 nginx 攒着一次性吐出，流式就失效了。
    # backend 响应头已带 X-Accel-Buffering: no，这里再显式关一次（不依赖上游头）。
    # 读超时放宽到 5 分钟（backend 的 SseEmitter 超时 5m；单次对话可能超过 nginx 默认的 60s，
    # 期间每 5 秒有一行 ": ping" 心跳，正常不会空闲这么久）。
    location ~ ^/api/conversations/[^/]+/chat$ {
        set $backend http://backend:8081;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering on;
        proxy_ignore_headers X-Accel-Buffering;
        proxy_buffer_size 128k;
        proxy_buffers 4 128k;
        proxy_busy_buffers_size 128k;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        set $backend http://backend:8081;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 接口文档（swagger-ui 本身走 backend）
    location ~ ^/(swagger-ui|v3/api-docs) {
        set $backend http://backend:8081;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
    }

    # 内部回调只给 ai-service → backend 的容器网络用，不对外暴露
    location /internal/ {
        return 404;
    }

    # 单页应用：未知路径回到 index.html，由 vue-router 处理；带哈希的静态资源可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
