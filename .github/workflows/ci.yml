# CI（CLAUDE.md §9）：不下载模型、不调用真实 LLM、不访问外网（除依赖下载外）。
#   backend       temurin 17，mvn -B verify
#   python        ai-service / mcp-tools / data-pipeline / eval 四个包矩阵：ruff check、ruff format --check、pytest（排除 integration/slow/live）；
#                 eval 的 pytest 含对仓库内评测集的离线校验（schema、题数、分层、引用）
#   scripts       security_scan / llm_smoke / gen_env 的离线单测 + 对本仓库跑安全扫描（含 --history）
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (mvn verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: mvn verify
        working-directory: backend
        run: mvn -B -ntp verify
      - name: 上传单测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 14

  python:
    name: python (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [ai-service, mcp-tools, data-pipeline, eval]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.package }}/pyproject.toml
      - name: 安装
        run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: pytest
        run: python -m pytest -m "not integration and not slow and not live"

  scripts:
    name: scripts + security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --history 需要完整历史
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/pyproject.toml
      - name: 安装
        run: python -m pip install "httpx>=0.27" "pytest>=8.3" "ruff>=0.6"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: pytest
        run: python -m pytest -m "not integration and not slow and not live"
      - name: 安全扫描（已跟踪文件）
        run: python security_scan.py
      - name: 安全扫描（全部历史）
        run: python security_scan.py --history
