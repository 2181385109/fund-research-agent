# CI（CLAUDE.md §9）：不下载模型、不调用真实 LLM、不访问外网（除依赖下载外）。
#   backend       temurin 17，mvn -B verify
#   frontend      node 22，npm ci → vitest（单测）→ vue-tsc + vite build（S7）
#   python        ai-service / mcp-tools / data-pipeline / eval 四个包矩阵：ruff check、ruff format --check、pytest（排除 integration/slow/live）；
#                 eval 的 pytest 含对仓库内评测集的离线校验（schema、题数、分层、引用）
#   messaging     （S11）ai-service 批量入库的集成测试：服务容器里的真实 Redis 8 + Kafka（锁、消费者组、DLQ、kill 接管）；
#                 backend 的 outbox / relay / 结果监听测试在 backend job 里用 Testcontainers 的 Kafka + MySQL
#   proto         （S9）proto 能编译，且已提交的 Python 桩代码与 proto 一致（Java 侧的桩代码由 backend job 的 mvn verify 在构建时生成并编译）
#   scripts       security_scan / llm_smoke / gen_env 的离线单测 + 对本仓库跑安全扫描（含 --history）
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (mvn verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: mvn verify
        working-directory: backend
        run: mvn -B -ntp verify
      - name: 上传单测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 14

  frontend:
    name: frontend (test + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装
        run: npm ci
      - name: 单测（vitest）
        run: npm test
      - name: 类型检查 + 构建
        run: npm run build

  python:
    name: python (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [ai-service, mcp-tools, data-pipeline, eval]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.package }}/pyproject.toml
      - name: 安装
        run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: pytest
        run: python -m pytest -m "not integration and not slow and not live"

  messaging:
    name: ai-service messaging (real Redis + Kafka)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.10.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml
      - name: 安装
        run: python -m pip install -e ".[dev]"
      - name: 集成测试（锁、消费者组、DLQ、kill 接管）
        env:
          FRA_TEST_REDIS: 127.0.0.1:6379
          FRA_TEST_KAFKA: 127.0.0.1:9092
        run: python -m pytest tests/test_messaging_integration.py -m integration -q

  proto:
    name: proto (compile + stubs up to date)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 grpcio-tools（版本与 ai-service 的 dev 依赖一致）
        run: python -m pip install "grpcio-tools==1.84.0"
      - name: 重新生成并与已提交的桩代码比较
        run: python scripts/gen_proto.py --check

  scripts:
    name: scripts + security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --history 需要完整历史
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/pyproject.toml
      - name: 安装
        run: python -m pip install "httpx>=0.27" "pytest>=8.3" "ruff>=0.6"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: pytest
        run: python -m pytest -m "not integration and not slow and not live"
      - name: 安全扫描（已跟踪文件）
        run: python security_scan.py
      - name: 安全扫描（全部历史）
        run: python security_scan.py --history
