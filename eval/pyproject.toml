[project]
name = "fund-eval"
version = "0.0.1"
description = "fund-research-agent 评测集工具：独立参考脚本（gold 计算）、数据集校验、词面重叠报告（S3）。不依赖被测系统（ai-service / mcp-tools）。"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "pymysql>=1.1",
    "pyyaml>=6",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "reportlab>=4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--strict-markers"
markers = [
    "integration: 需要 docker compose 起的 infra",
    "slow: 需要下载或加载本地模型",
    "live: 调用真实 LLM 或访问外网",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 题面模板是整句中文字符串（按双宽计常超 120），拆行会破坏可读性和按题面 grep
"reference/templates.py" = ["E501"]

[tool.ruff.lint.pycodestyle]
# 中文按双宽计：formatter 仍按 100 排版，E501 放宽到 120（同 data-pipeline、ai-service）
max-line-length = 120
