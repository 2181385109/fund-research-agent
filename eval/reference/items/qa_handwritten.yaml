  style: paraphrase
  fund: "110023"
  question: "拿着易方达医疗保健行业混合的A类份额，满7天但还不到一年就卖掉，要按多少比例交赎回费？以最新招募说明书为准。"
  answer_type: numeric
  gold_value: "0.5%"
  tolerance: 0.001
  reference_answer: "A类份额持有7–364天赎回，赎回费率为0.5%。"
  answer_points: ["0.5%"]
  evidence:
    - doc: prospectus
      quote: "持有时间（天） A 类基金份额赎回费率 0-6 1.5% 7-364 0.5%"
