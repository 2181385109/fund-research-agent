# fund_qa_v1 手写题（provenance=llm_draft）：执行者阅读 PDF 原文（pdfplumber 逐页文本）后起草。
# 构建脚本 reference.build_datasets 会：解析 doc_id、定位页码（quote 必须是原文逐字子串，按去空白口径）、
# 检查 numeric 题的 gold 数字逐字出现在 quote 里；nav_check 的题额外用快照净值自算做交叉核对（写进 notes）。
# 字段：topic style fund|funds question answer_type gold_value tolerance reference_answer answer_points
#       evidence[{doc, period?, fund?, quote}] notes nav_check

# ------------------------------------------------------------------ fee（补充：申购 / 赎回费率）
- topic: fee
  style: keyword
  fund: "110023"
  question: "根据最新一期招募说明书，普通投资者（非养老金等特定投资群体）申购易方达医疗保健行业混合A类份额、金额不足100万元时，申购费率是多少？"
  answer_type: numeric
  gold_value: "1.5%"
  tolerance: 0.001
  reference_answer: "其他投资者申购A类份额，申购金额M＜100万元时申购费率为1.5%。"
  answer_points: ["1.5%"]
  evidence:
    - doc: prospectus
      quote: "其他投资者申购本基金A类基金份额的申购费率见下表"
    - doc: prospectus
      quote: "M＜100 万 1.5% 100 万≤M＜500 万 1.2%"
  notes: "原文另有特定投资群体（养老金）费率表 0.15%，题目限定为其他投资者。冻结前把跨「引导句+表头+数据行」的 quote 拆成两条：入库 markdown 表格的表头与数据行之间有 |---| 分隔行，跨越它的 quote 无法连续匹配"
