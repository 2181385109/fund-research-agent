# ------------------------------------------------------------------ no_tool（通用知识，不需要调用工具）
- topic: no_tool
  style: paraphrase
  funds: []
  question: "基金的A类份额和C类份额有什么区别？"
  answer_type: text
  reference_answer: "A类通常在申购时收取申购费、不收销售服务费；C类通常不收申购费、按日计提销售服务费。长期持有A类可能更省，短期持有C类可能更省，具体以各基金招募说明书为准。"
  answer_points: ["A类收申购费、不收销售服务费", "C类不收申购费、计提销售服务费", "适合的持有期限不同"]
  expected_tools: []
- topic: no_tool
  style: keyword
  funds: []
  question: "区间收益率和年化收益率有什么区别？"
  answer_type: text
  reference_answer: "区间收益率是一段时间内的总收益；年化收益率是把区间收益按时间长度折算成一年的收益率，便于比较不同长度的区间。"
  answer_points: ["区间收益率是整段时间的总收益", "年化收益率按时间长度折算到一年"]
  expected_tools: []
- topic: no_tool
  style: paraphrase
  funds: []
  question: "基金合同里说的“业绩比较基准”是什么意思？"
