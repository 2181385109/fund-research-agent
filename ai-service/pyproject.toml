[project]
name = "fund-ai"
version = "0.0.1"
description = "fund-research-agent AI 服务：文档入库、混合检索、LangGraph Agent"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "redis>=5.0",
    "pdfplumber>=0.11",
    "pymilvus>=2.5,<2.6",
    "elasticsearch>=8.15,<9",
    "pymysql>=1.1",  # S4：实体词典从 fund_data 读（fund_reader 只读）
    # S5 Agent。mcp 固定 1.x（ADR-040）；langchain-mcp-adapters 0.3.2 要求 mcp>=1.24,<2，
    # 已验证能同时连上 ai-service /mcp 和 mcp-tools（ADR-041）
    "mcp>=1.24,<2",
    "langchain-mcp-adapters==0.3.2",
    "langgraph>=1.2,<2",
    "langchain-openai>=1.6,<2",
    # S9 gRPC。生成的桩代码（src/fundagent/）会校验运行时版本不低于生成时的版本，所以下限与 dev 里的 grpcio-tools 对齐
    "grpcio>=1.84,<2",
    "protobuf>=7.36,<8",
]

[project.optional-dependencies]
# 本地向量模型（torch CPU + sentence-transformers）；CI 不装、不下载模型，测试用 FakeEmbedder
model = [
    "sentence-transformers>=3",
]
# S8 人工盲标表（.xlsx）；缺少时 `eval.answer blind` 退回 CSV
eval = [
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "reportlab>=4",
    "grpcio-tools==1.84.0",  # 生成桩代码用（scripts/gen_proto.py）；固定版本保证生成结果可复现
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fund_ai", "src/fundagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: 需要 docker compose 起的 infra",
    "slow: 需要下载或加载本地模型",
    "live: 调用真实 LLM 或访问外网",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# protoc 生成的桩代码（scripts/gen_proto.py），不做 lint / 格式化
extend-exclude = ["src/fundagent"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.pycodestyle]
# 中文按双宽计：formatter 仍按 100 排版，E501 只对中文注释/字符串放宽到 120
max-line-length = 120
