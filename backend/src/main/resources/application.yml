# 所有值来自环境变量；本机开发时从仓库根目录的 .env 读取（spring.config.import），不写死 host、端口或密钥。
spring:
  application:
    name: fund-research-agent-backend
  config:
    # 在 backend/ 下运行时读 ../.env，在仓库根目录运行时读 ./.env；都不存在时忽略（CI 与容器里直接用环境变量）
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_APP_DB:fra_app}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_APP_USER:fra_app}
    password: ${MYSQL_APP_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      # 取连接的最长等待，同时是 health 探测 MySQL 的上限
      connection-timeout: ${HEALTH_TIMEOUT_SECONDS:2}000
      initialization-fail-timeout: -1
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: ${HEALTH_TIMEOUT_SECONDS:2}s
      connect-timeout: ${HEALTH_TIMEOUT_SECONDS:2}s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${BACKEND_PORT:8081}

fra:
  health:
    timeout: ${HEALTH_TIMEOUT_SECONDS:2}s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
