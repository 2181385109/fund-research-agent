# 所有值来自环境变量；本机开发时从仓库根目录的 .env 读取（spring.config.import），不写死 host、端口或密钥。
spring:
  application:
    name: fund-research-agent-backend
  config:
    # 在 backend/ 下运行时读 ../.env，在仓库根目录运行时读 ./.env；都不存在时忽略（CI 与容器里直接用环境变量）
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_APP_DB:fra_app}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_APP_USER:fra_app}
    password: ${MYSQL_APP_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      # 取连接的最长等待，同时是 health 探测 MySQL 的上限
      connection-timeout: ${HEALTH_TIMEOUT_SECONDS:2}000
      initialization-fail-timeout: -1
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: ${HEALTH_TIMEOUT_SECONDS:2}s
      connect-timeout: ${HEALTH_TIMEOUT_SECONDS:2}s
  kafka:
    # S11：outbox relay 的生产者与结果 topic 的消费者；Kafka 暂时不可用不影响启动（消息留在 outbox 表里）
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9094}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # relay 在事务里发送：Kafka 不可用时要尽快失败而不是卡住（默认 max.block.ms=60s）
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      missing-topics-fatal: false
  servlet:
    multipart:
      # 上传上限 20MB（PLAN S6）；UploadValidator 再按 fra.upload.max-size 校验一次
      max-file-size: 21MB
      max-request-size: 22MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${BACKEND_PORT:8081}

fra:
  health:
    timeout: ${HEALTH_TIMEOUT_SECONDS:2}s
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl: ${JWT_TTL:12h}
    internal-secret: ${INTERNAL_CALLBACK_SECRET:}
  upload:
    # 必须在 ai-service 的 DATA_DIR 之下；留空 = ../data/uploads（相对 backend/ 目录）
    dir: ${UPLOAD_DIR:../data/uploads}
    max-size: 20MB
    stale-after: ${UPLOAD_STALE_AFTER:15m}
    sweep-interval: 60s
  ai:
    # grpc（默认，S9）| http（第一期的 HTTP + SSE，保留作回退与对照）
    transport: ${AI_TRANSPORT:grpc}
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8001}
    grpc:
      target: ${AI_SERVICE_GRPC_TARGET:127.0.0.1:50051}
      chat-deadline: ${AI_GRPC_CHAT_DEADLINE:6m}
    connect-timeout: 3s
    request-timeout: 15s
    chat-idle-timeout: ${AI_CHAT_IDLE_TIMEOUT:120s}
  chat:
    history-rounds: ${CHAT_HISTORY_ROUNDS:6}
    heartbeat: ${CHAT_HEARTBEAT:1s}
    emitter-timeout: 5m

  # S10：限流（令牌桶，用户 + 全局）与每日配额；Redis 故障时放行（ADR-048）
  ratelimit:
    enabled: ${RATELIMIT_ENABLED:true}
    user-capacity: ${RATELIMIT_USER_CAPACITY:10}
    user-refill-per-sec: ${RATELIMIT_USER_REFILL_PER_SEC:0.5}
    global-capacity: ${RATELIMIT_GLOBAL_CAPACITY:100}
    global-refill-per-sec: ${RATELIMIT_GLOBAL_REFILL_PER_SEC:10}
    daily-calls: ${QUOTA_DAILY_CALLS:200}
    daily-tokens: ${QUOTA_DAILY_TOKENS:500000}
    zone: ${QUOTA_ZONE:Asia/Shanghai}
    flush-interval: ${QUOTA_FLUSH_INTERVAL:30s}

  # S11：季报批量入库（outbox + relay + 结果消费，ADR-049）
  ingest-batch:
    enabled: ${INGEST_BATCH_ENABLED:true}
    manifest: ${INGEST_MANIFEST_PATH:../data/MANIFEST.json}
    doc-type: quarterly_report
    requested-topic: ${KAFKA_TOPIC_REQUESTED:doc.ingest.requested}
    result-topic: ${KAFKA_TOPIC_RESULT:doc.ingest.result}
    result-group: ${KAFKA_RESULT_GROUP:fra-backend-ingest-result}
    relay-interval: ${INGEST_RELAY_INTERVAL:500ms}
    relay-batch-size: 50
    send-timeout: 15s
    stale-after: ${INGEST_BATCH_STALE_AFTER:24h}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
